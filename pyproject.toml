[project]
name = "subspacead"
version = "0.1.0"
description = "Training-free few-shot anomaly detection via subspace modeling (reproduction of SubspaceAD)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "scikit-learn",
    "scikit-image",
    "pillow",
    "pandas",
    "tqdm",
    "pyyaml",
    "matplotlib",
    "psutil",
    "huggingface-hub",
    "requests",
    "fastapi>=0.143.0",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["subspacead"]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
